name: Deploy to Remote Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no deploy@72.56.38.217 << 'EOF'
            set -e

            # Установка зависимостей только при первом деплое
            if ! command -v python3 &>/dev/null; then
              sudo apt update && sudo apt install -y python3 python3-venv python3-pip git
            fi

            mkdir -p /opt/Server_FastAPI
            cd /opt/Server_FastAPI

            if [ ! -d ".git" ]; then
              git clone https://github.com/KaRletka/Server_FastAPI.git .
            else
              git pull origin main
            fi

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --quiet -r requirements.txt

            # Создаём .env на сервере, если не существует
            if [ ! -f ".env" ]; then
              echo "DB_PATH=/var/lib/server_fastapi/dictionary.sqlite" > .env
              echo "LOG_PATH=/var/lib/server_fastapi/api.log" >> .env
              mkdir -p /var/lib/server_fastapi
            fi

            # Устанавливаем systemd-юнит
            sudo cp fastapi.service /etc/systemd/system/fastapi.service
            sudo systemctl daemon-reload
            sudo systemctl enable fastapi
            sudo systemctl restart fastapi
          EOF
